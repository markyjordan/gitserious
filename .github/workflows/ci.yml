name: CI

on:
  pull_request:
    branches:
      - dev
      - main
      - "release/**"
  push:
    branches:
      - dev
      - main
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ref-policy:
    name: ref-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Exercise accepted and rejected topology fixtures
        run: bash scripts/ci/test-validate-ref-policy.sh

      - name: Validate branch topology
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: bash scripts/ci/validate-ref-policy.sh

  ci-pass:
    name: ci-pass
    if: always()
    needs:
      - ref-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every CI component
        env:
          REF_POLICY_RESULT: ${{ needs.ref-policy.result }}
        run: |
          if [[ "$REF_POLICY_RESULT" != "success" ]]; then
            echo "Branch topology validation did not pass: $REF_POLICY_RESULT" >&2
            exit 1
          fi
