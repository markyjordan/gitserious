name: CI

on:
  pull_request:
    branches:
      - dev
      - main
      - "release/**"
  push:
    branches:
      - dev
      - main
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ref-policy:
    name: ref-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Exercise accepted and rejected topology fixtures
        run: bash scripts/ci/tests/test-validate-ref-policy.sh

      - name: Validate branch topology
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: bash scripts/ci/validate-ref-policy.sh

  check-code:
    needs:
      - ref-policy
    uses: ./.github/workflows/check-code.yml

  check-fmt:
    needs:
      - ref-policy
    uses: ./.github/workflows/check-fmt.yml

  check-lint:
    needs:
      - ref-policy
    uses: ./.github/workflows/check-lint.yml

  test:
    needs:
      - ref-policy
    uses: ./.github/workflows/test.yml

  automation-quality:
    uses: ./.github/workflows/automation-quality.yml

  dependency-security:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/dependency-security.yml

  package-inspect:
    name: package-inspect
    if: >-
      github.base_ref == 'main' ||
      startsWith(github.base_ref, 'release/') ||
      github.ref_name == 'main' ||
      startsWith(github.ref_name, 'release/')
    needs:
      - ref-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Build and inspect release packages
        run: bash scripts/ci/run-rust-quality.sh release

  native-binaries:
    name: native-four
    if: >-
      github.base_ref == 'main' ||
      startsWith(github.base_ref, 'release/') ||
      github.ref_name == 'main' ||
      startsWith(github.ref_name, 'release/')
    needs:
      - ref-policy
    uses: ./.github/workflows/build-release-binaries.yml
    with:
      release-ref: ${{ github.sha }}

  release-readiness:
    if: >-
      github.event_name == 'pull_request' &&
      (github.base_ref == 'main' || startsWith(github.base_ref, 'release/'))
    needs:
      - check-code
      - check-fmt
      - check-lint
      - test
      - package-inspect
      - native-binaries
    uses: ./.github/workflows/release-readiness.yml
    with:
      release-ref: ${{ github.base_ref }}

  ci-pass:
    name: ci-pass
    if: always()
    needs:
      - ref-policy
      - check-code
      - check-fmt
      - check-lint
      - test
      - package-inspect
      - native-binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Require every CI component
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/ci/require-job-results.sh package-inspect native-binaries
