name: Trusted Automation Review

on:
  # Keep the gate definition on the default branch. This workflow must never
  # check out or execute code from the pull request head.
  pull_request_target:
    branches:
      - dev
      - main
      - "release/**"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  issue_comment:
    types:
      - created
      - edited
      - deleted

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: trusted-automation-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  trusted-automation-review:
    name: trusted-automation-review
    if: >-
      github.repository == 'markyjordan/gitserious' &&
      ((github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
      github.event.pull_request.base.ref == 'dev' ||
      github.event.pull_request.base.ref == 'main' ||
      startsWith(github.event.pull_request.base.ref, 'release/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Resolve pull request context
        id: pull-request
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            pr_number="$ISSUE_NUMBER"
            context="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}" \
              --jq '[.base.ref, .base.sha, .head.sha, .user.login] | @tsv')"
            IFS=$'\t' read -r base_ref base_sha head_sha author_login <<<"$context"
          else
            pr_number="$EVENT_PR_NUMBER"
            base_ref="$EVENT_PR_BASE_REF"
            base_sha="$EVENT_PR_BASE_SHA"
            head_sha="$EVENT_PR_HEAD_SHA"
            author_login="$EVENT_PR_AUTHOR_LOGIN"
          fi

          case "$base_ref" in
            dev | main | release/*) ;;
            *)
              echo "Unsupported protected target: $base_ref" >&2
              exit 1
              ;;
          esac

          printf 'number=%s\nbase-sha=%s\nhead-sha=%s\nauthor-login=%s\n' \
            "$pr_number" "$base_sha" "$head_sha" "$author_login" >>"$GITHUB_OUTPUT"

      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ steps.pull-request.outputs.base-sha }}

      - name: Select trusted validator source
        id: validator
        run: |
          if [[ -f scripts/ci/validate-trusted-automation-review.sh ]]; then
            echo "root=." >>"$GITHUB_OUTPUT"
            echo "Using the validator from the protected base commit."
          else
            echo "root=.trusted-automation-bootstrap" >>"$GITHUB_OUTPUT"
            echo "The protected base predates the validator; using the signed bootstrap tree."
          fi

      # One-time trust anchor for the PR that introduces this gate. Once the
      # validator exists on dev, the protected base checkout above always wins.
      - name: Check out signed bootstrap validator
        if: steps.validator.outputs.root != '.'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          path: .trusted-automation-bootstrap
          persist-credentials: false
          ref: e93771fa9db70e955bb5c22ee4d9146dd34c80a7

      # Promotion and release targets may predate the status reporter. Load that
      # helper from protected default-branch state, never from the PR head.
      - name: Check out trusted status reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          path: .trusted-automation-status
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Exercise exact-head status fixtures
        env:
          STATUS_ROOT: .trusted-automation-status
        run: bash "$STATUS_ROOT/scripts/ci/tests/test-report-trusted-automation-status.sh"

      - name: Mark exact-head review pending
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ steps.pull-request.outputs.head-sha }}
          STATUS_ROOT: .trusted-automation-status
          TRUST_STATUS: pending
          TRUST_STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash "$STATUS_ROOT/scripts/ci/report-trusted-automation-status.sh"

      - name: Exercise current-head review fixtures
        id: review-fixtures
        continue-on-error: true
        env:
          VALIDATOR_ROOT: ${{ steps.validator.outputs.root }}
        run: bash "$VALIDATOR_ROOT/scripts/ci/tests/test-trusted-automation-review.sh"

      - name: Validate trusted automation review
        id: review
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          PR_AUTHOR_LOGIN: ${{ steps.pull-request.outputs.author-login }}
          PR_HEAD_SHA: ${{ steps.pull-request.outputs.head-sha }}
          VALIDATOR_ROOT: ${{ steps.validator.outputs.root }}
        run: bash "$VALIDATOR_ROOT/scripts/ci/validate-trusted-automation-review.sh"

      - name: Report exact-head review result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ steps.pull-request.outputs.head-sha }}
          REVIEW_FIXTURES_OUTCOME: ${{ steps.review-fixtures.outcome }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          STATUS_ROOT: .trusted-automation-status
          TRUST_STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          status=failure
          if [[ "$REVIEW_FIXTURES_OUTCOME" == success && "$REVIEW_OUTCOME" == success ]]; then
            status=success
          fi
          TRUST_STATUS="$status" \
            bash "$STATUS_ROOT/scripts/ci/report-trusted-automation-status.sh"

          if [[ "$status" == success ]]; then
            echo "Trusted automation review passed."
          else
            echo "Trusted automation review is blocked; the exact-head status is the merge gate."
          fi
