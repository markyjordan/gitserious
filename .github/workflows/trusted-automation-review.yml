name: Trusted Automation Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, closed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Trusted Review Wakeup]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: read # why: Pin executable policy to protected default-branch state.
  issues: read # why: Read human approval comments.
  pull-requests: read # why: Discover current native stacks and review evidence.

concurrency:
  group: trusted-automation-review-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  trusted-automation-review:
    if: >-
      github.repository == 'markyjordan/gitserious' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    permissions:
      contents: read # why: Fetch commit objects for signature and ancestry validation.
      issues: read # why: Read human approval comments.
      pull-requests: read # why: Discover current stacks, paths, reviews, and maintainer access.
      statuses: write # why: Publish each exact head's trusted-review decision.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout@v7.0.1
      - id: policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Exercise trusted review fixtures
        id: fixtures
        continue-on-error: true
        run: |
          set -euo pipefail
          bash scripts/ci/tests/test-trusted-automation-review.sh
          bash scripts/ci/tests/test-report-trusted-automation-status.sh
          python3 scripts/ci/tests/test-reconcile-trusted-automation-review.py

      - name: Reconcile current approval scopes
        if: always() && steps.policy.outcome == 'success'
        env:
          TRUST_REVIEW_FIXTURES_OUTCOME: ${{ steps.fixtures.outcome }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRUST_STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/ci/reconcile-trusted-automation-review.py
