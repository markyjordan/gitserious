name: Release Readiness

on:
  workflow_call:
    inputs:
      release-ref:
        description: "Promotion target ref"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag, such as v0.1.0-rc1 or v0.1.0"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    name: release-readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # Verify a manually selected tag with protected default-branch code before
      # the tag is checked out or any of its scripts are executed.
      # actions/checkout@v7.0.1
      - name: Check out trusted release tag verifier
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          path: .trusted-release-verifier
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Verify registered release tag signer
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        working-directory: .trusted-release-verifier
        run: bash scripts/ci/verify-maintainer-signature.sh tag "$RELEASE_TAG"

      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Exercise release validation fixtures
        run: bash scripts/release/tests/test-check-release.sh

      - name: Validate promotion readiness without rerunning quality
        if: github.event_name == 'pull_request'
        env:
          RELEASE_REF: ${{ inputs.release-ref }}
        run: bash scripts/release/validate-release-readiness.sh

      - name: Set up Rust toolchain for manual readiness
        if: github.event_name == 'workflow_dispatch'
        run: |
          rustup toolchain install --no-self-update
          rustup show

      - name: Run full manual release readiness
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/release/check-release.sh
