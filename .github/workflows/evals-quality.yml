name: Evals Quality

on:
  workflow_call:

permissions:
  contents: read # why: Check out the workspace and its dependency lockfile.

defaults:
  run:
    shell: bash
    working-directory: evals

jobs:
  offline:
    name: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned uv
        env:
          UV_VERSION: "0.13.5"
          UV_SHA256: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
        run: |
          set -euo pipefail
          archive="uv-x86_64-unknown-linux-gnu.tar.gz"
          install_dir="$RUNNER_TEMP/evals-uv"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/$archive"
          printf '%s  %s\n' "$UV_SHA256" "$RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$install_dir"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$install_dir" --strip-components=1
          printf '%s\n' "$install_dir" >>"$GITHUB_PATH"

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          uv sync --python 3.12 --locked

      - name: Check Python and source quality
        run: |
          set -euo pipefail
          uv run --locked --offline python -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          uv run --locked --offline ruff check .
          uv run --locked --offline ruff format --check .

      - name: Run offline tests
        run: |
          set -euo pipefail
          sudo --non-interactive /usr/bin/unshare --net \
            --setgid "$(id -g)" --setuid "$(id -u)" \
            /usr/bin/env -i HOME="$HOME" PATH="$PATH" INSPECT_EVAL_CTL_SERVER=false \
            .venv/bin/python -m pytest -q
