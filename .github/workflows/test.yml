name: Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        shell: bash
        run: rustup toolchain install --no-self-update

      - name: Test Rust workspace
        shell: bash
        run: bash scripts/ci/run-rust-quality.sh test
