name: Test

on:
  workflow_call:

permissions:
  contents: read # why: Read repository source and metadata required by this workflow.

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/shared/setup-rust-toolchain.sh

      - name: Test Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/run-rust-quality.sh test
