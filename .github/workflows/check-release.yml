name: Check Release

on:
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag, such as v0.1.0-rc1 or v0.1.0"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: check-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    name: release-readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # actions/checkout@v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show

      - name: Exercise release validation fixtures
        run: bash scripts/release/test-check-release.sh

      - name: Check release readiness
        env:
          RELEASE_REF: ${{ github.base_ref || github.ref_name }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: bash scripts/release/check-release.sh
