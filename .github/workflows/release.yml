name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-rc*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to process"
        required: true
        type: string
      release-mode:
        description: "Simulate or publish after protected environment approval"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: build-release-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      is_rc: ${{ steps.release.outputs.is_rc }}
      release_mode: ${{ steps.release.outputs.release_mode }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      RELEASE_MODE: ${{ github.event.inputs['release-mode'] || 'dry-run' }}

    steps:
      # actions/checkout@v7.0.0
      - name: Check out trusted release request policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Exercise release request fixtures
        run: bash scripts/release/test-validate-release-request.sh

      - name: Record release request
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
        run: bash scripts/release/validate-release-request.sh

      - name: Check out validated release tag
        env:
          VALIDATED_RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          git fetch --no-tags origin \
            "refs/tags/${VALIDATED_RELEASE_TAG}:refs/tags/${VALIDATED_RELEASE_TAG}"
          git switch --detach "refs/tags/${VALIDATED_RELEASE_TAG}^{commit}"

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show

      - name: Exercise artifact fixtures
        run: bash scripts/release/test-build-artifacts.sh

      - name: Check release readiness
        run: bash scripts/release/check-release.sh

      - name: Build release artifacts
        run: bash scripts/release/build-artifacts.sh

      # actions/upload-artifact@v7.0.1
      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.RELEASE_TAG }}-artifacts
          path: target/release-artifacts/**
          if-no-files-found: error

  publish-release-candidate:
    name: publish-release-candidate
    if: needs.build.outputs.release_mode == 'publish' && needs.build.outputs.is_rc == 'true'
    needs:
      - build
    environment: release-candidate
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_MODE: ${{ needs.build.outputs.release_mode }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}

    steps:
      # actions/checkout@v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      # actions/download-artifact@v8
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.RELEASE_TAG }}-artifacts
          path: target/release-artifacts

      - name: Exercise release-candidate publication fixtures
        run: bash scripts/release/test-publish-release-candidate.sh

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/release/publish-release-candidate.sh

  publish-stable:
    name: publish-stable
    if: needs.build.outputs.release_mode == 'publish' && needs.build.outputs.is_rc == 'false'
    needs:
      - build
    environment: crates-io-release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      RELEASE_MODE: ${{ needs.build.outputs.release_mode }}
      CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

    steps:
      # actions/checkout@v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Rust toolchain
        run: rustup toolchain install --no-self-update

      # actions/download-artifact@v8
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.RELEASE_TAG }}-artifacts
          path: target/release-artifacts

      - name: Exercise stable publication fixtures
        run: bash scripts/release/test-publish-stable.sh

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/release/publish-stable.sh
