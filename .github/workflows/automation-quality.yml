name: Automation Quality

on:
  pull_request:
    branches:
      - dev
      - main
      - "release/**"
  push:
    branches:
      - dev
      - main
      - "release/**"

permissions:
  contents: read

concurrency:
  group: automation-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  automation-quality:
    name: automation-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # actions/checkout@v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      - name: Validate workflow syntax and expressions
        run: |
          actionlint_bin="$(go env GOPATH)/bin/actionlint"
          "$actionlint_bin"

      - name: Exercise release request policy fixtures
        run: bash scripts/release/test-validate-release-request.sh

      - name: Install pinned ShellCheck
        env:
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
          SHELLCHECK_VERSION: v0.11.0
        run: |
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          curl -fsSLo "/tmp/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/$archive"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "/tmp/$archive" | sha256sum -c -
          tar -xzf "/tmp/$archive" -C /tmp
          printf '%s\n' "/tmp/shellcheck-${SHELLCHECK_VERSION}" >>"$GITHUB_PATH"

      - name: Validate shell scripts
        run: |
          command -v shellcheck >/dev/null
          find scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck

      # zizmorcore/zizmor-action@v0.5.7
      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa
        with:
          advanced-security: false
          annotations: false
          min-confidence: medium
          min-severity: medium
          online-audits: true
          persona: pedantic
          version: "1.26.1"
