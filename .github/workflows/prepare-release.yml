name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version-family:
        description: "Release family to cut, such as 0.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ inputs['version-family'] }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: prepare-release
    environment: release-branch-management
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # actions/checkout@v7.0.0
      - name: Check out trusted release preparation policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Exercise release preparation request fixtures
        run: bash scripts/release/test-validate-prepare-release-request.sh

      - name: Validate release preparation request
        id: request
        env:
          BASE_REF: main
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          REQUEST_REF: ${{ github.ref }}
          VERSION_FAMILY: ${{ inputs['version-family'] }}
        run: bash scripts/release/validate-prepare-release-request.sh

      # Execute the mutating repository script only from the validated stable
      # base, never from a caller-selected ref.
      - name: Check out validated stable base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ steps.request.outputs.base_ref }}

      - name: Exercise release-branch preparation fixtures
        run: bash scripts/release/test-prepare-release.sh

      - name: Cut release branch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          VERSION_FAMILY: ${{ inputs['version-family'] }}
          BASE_REF: ${{ steps.request.outputs.base_ref }}
        run: bash scripts/release/prepare-release.sh
