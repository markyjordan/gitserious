[workspace]
members = [
    "crates/gitserious",
    "crates/gitserious-app",
    "crates/gitserious-cli",
    "crates/gitserious-core",
    "crates/gitserious-fs",
]
default-members = ["crates/gitserious"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["markyjordan"]
description = "Why did this commit message explain nothing? C'mon, gitserious!"
repository = "https://github.com/markyjordan/gitserious"
readme = "README.md"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
gitserious-app = { path = "crates/gitserious-app", version = "0.1.0" }
gitserious-cli = { path = "crates/gitserious-cli", version = "0.1.0" }
gitserious-core = { path = "crates/gitserious-core", version = "0.1.0" }
gitserious-fs = { path = "crates/gitserious-fs", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = { version = "0.11.0", default-features = false }
tempfile = "3.27.0"
toml = "1.1.4"

# dev-dependencies


[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -2 }

# accidental debug output
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"

# unfinished code paths
panic = "warn"
todo = "warn"
unimplemented = "warn"

# casual failure handling
expect_used = "warn"
unwrap_used = "warn"
